<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ cake.name }} — Десерты мечты</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', -apple-system, sans-serif;
            background: #fff9f9; margin: 0; min-height: 100vh; padding-bottom: 60px; color: #4a4a4a;
        }
        .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-top: 10px; }
        .logo { color: #c47488; font-size: 24px; font-weight: 700; text-decoration: none; }
        .cart-link {
            background: #fff; color: #c47488; padding: 10px 20px; border-radius: 20px; 
            text-decoration: none; font-weight: 600; box-shadow: 0 4px 15px rgba(214, 138, 156, 0.15); font-size: 14px;
            transition: all 0.2s;
        }
        .cart-link:hover { box-shadow: 0 6px 20px rgba(214, 138, 156, 0.25); transform: translateY(-1px); }
        
        .product-card {
            background: #fff; border-radius: 24px; padding: 30px;
            box-shadow: 0 8px 30px rgba(214, 138, 156, 0.08); border: 1px solid #fcf0f2;
            display: flex; gap: 40px; flex-wrap: wrap;
        }
        
        .product-image {
            width: 400px; height: 400px; background: #fceef1; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: #d68a9c; font-size: 100px; font-weight: 700; flex-shrink: 0;
        }

        .product-info { flex: 1; min-width: 280px; display: flex; flex-direction: column; }
        h1 { color: #333; font-size: 32px; margin: 0 0 10px 0; font-weight: 700; }
        .price { font-size: 28px; font-weight: 700; color: #c47488; margin-bottom: 20px; }
        .desc { font-size: 16px; color: #777; line-height: 1.6; margin-bottom: 24px; }
        
        .specs { background: #faf5f5; padding: 16px 20px; border-radius: 16px; margin-bottom: 24px; }
        .spec-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: #555; }
        .spec-row:last-child { margin-bottom: 0; }
        .spec-label { color: #999; }

        button.add {
            width: 100%; padding: 16px; background: #d68a9c; color: #fff;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 600; 
            cursor: pointer; transition: background 0.2s; margin-top: auto;
        }
        button.add:hover { background: #c47488; }
        
        .back-link { display: inline-block; margin-top: 24px; color: #c47488; text-decoration: none; font-weight: 600; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top-bar">
            <a href="/" class="logo">Десерты мечты</a>
            <a href="/cart" class="cart-link">Корзина ({{ cart_count }})</a>
        </div>

        <div class="product-card">
            <div class="product-image">{{ cake.name[0] }}</div>
            
            <div class="product-info">
                <h1>{{ cake.name }}</h1>
                <div class="price">{{ cake.price }} <small>руб.</small></div>
                <div class="desc">{{ cake.desc }}</div>
                
                <div class="specs">
                    <div class="spec-row"><span class="spec-label">Вес:</span> <span>{{ cake.weight }}</span></div>
                    <div class="spec-row"><span class="spec-label">Начинка:</span> <span>{{ cake.filling }}</span></div>
                </div>

                <form method="POST" action="/add/{{ cake.id }}">
                    <button type="submit" class="add">Добавить в корзину</button>
                </form>
                
                <a href="/" class="back-link">← Вернуться к выбору тортов</a>
            </div>
        </div>
    </div>
</body>
</html>
